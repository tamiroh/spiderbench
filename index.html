<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Spidey</title>
<link rel="icon" href="data:," />
<style>
html,body{margin:0;height:100%;overflow:hidden;background:#000}canvas{display:block}
#loading{position:fixed;inset:0;z-index:10000;display:grid;place-items:center;background:#000;color:#fff;font:24px sans-serif;letter-spacing:.12em}
.loading-content{display:grid;justify-items:center;gap:20px;width:min(280px,80vw)}
.loading-spinner{width:36px;height:36px;border:3px solid #ffffff30;border-top-color:#fff;border-radius:50%;animation:loading-spin 1s linear infinite}
#loading-stage{font:14px sans-serif;letter-spacing:normal;color:#bbb}
#loading-progress{appearance:none;-webkit-appearance:none;width:100%;height:8px;border:0;border-radius:4px;overflow:hidden;background:#292929;accent-color:#ff4055}
#loading-progress::-webkit-progress-bar{background:#292929;border-radius:4px}
#loading-progress::-webkit-progress-value{background:#ff4055;border-radius:4px}
#loading-progress::-moz-progress-bar{background:#ff4055;border-radius:4px}
@keyframes loading-spin{to{transform:rotate(360deg)}}
@media(prefers-reduced-motion:reduce){.loading-spinner{animation:none}}
</style>
</head>
<body>
<div id="loading" role="status" aria-live="polite">
  <div class="loading-content">
    <div class="loading-spinner" aria-hidden="true"></div>
    <div>Loading</div>
    <div id="loading-stage">Starting…</div>
    <progress id="loading-progress" max="16" value="0" aria-label="Loading stages completed"></progress>
  </div>
</div>
<div id="hud"></div>
<script type="module" src="/src/main.js"></script>
</body>
</html>
